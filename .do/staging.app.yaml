# DigitalOcean App Platform spec for the ReorderOS STAGING app.
#
# Clean env layout (no duplicates): shared vars + the 3 shared secrets are APP-LEVEL (inherited by
# every component); api-only vars live on the api service; the worker inherits everything and only
# carries its run_command. Secrets are declared `type: SECRET` WITHOUT values — set the 5 values once
# in the DO console after applying (never commit secret values).
#
# Apply the clean layout to the existing app:
#   doctl apps update 70e351c1-3c5f-4699-b85b-05a2346e7f84 --spec .do/staging.app.yaml
# Then set the 5 secret values in the console (3 app-level, 2 on api), Encrypt each.
#
# First create (fresh): doctl apps create --spec .do/staging.app.yaml --project-id <ReOrderOS-id>

name: reorderos-staging
region: tor1

# ── APP-LEVEL: inherited by api AND inbox-worker (set shared secrets ONCE here) ──
envs:
  - key: APP_ENV
    scope: RUN_AND_BUILD_TIME
    value: production
  - key: APP_LOG_LEVEL
    scope: RUN_AND_BUILD_TIME
    value: INFO
  - key: DATABASE_URL
    scope: RUN_TIME
    value: ${reorderos-staging-pg.DATABASE_URL}
  - key: CLOVER_APP_ID
    scope: RUN_TIME
    value: "DJFFAT14DS7QM"
  - key: CLOVER_ENVIRONMENT
    scope: RUN_TIME
    value: sandbox
  - key: CLOVER_API_BASE_URL
    scope: RUN_TIME
    value: https://apisandbox.dev.clover.com
  # ── shared secrets (set value once in console, app-level, Encrypt) ──
  - key: TOKEN_ENCRYPTION_KEY
    scope: RUN_TIME
    type: SECRET
  - key: SERVICE_DATABASE_URL
    scope: RUN_TIME
    type: SECRET
  - key: CLOVER_APP_SECRET
    scope: RUN_TIME
    type: SECRET

services:
  - name: api
    github:
      repo: OsmanWais29/ReorderOS
      branch: sprint-5-recipe-depletion
      deploy_on_push: true
    source_dir: backend
    dockerfile_path: backend/Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /health/ready
      initial_delay_seconds: 20
      period_seconds: 15
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    routes:
      - path: /
    envs:
      # api-only (auth + OAuth/webhook + CORS). Shared vars/secrets come from app-level above.
      - key: WORKOS_CLIENT_ID
        scope: RUN_TIME
        value: client_01KQT0CRCZP8W8AMAYE5Y1F9SP
      - key: WORKOS_JWKS_URL
        scope: RUN_TIME
        value: https://api.workos.com/sso/jwks/client_01KQT0CRCZP8W8AMAYE5Y1F9SP
      - key: WORKOS_ISSUER
        scope: RUN_TIME
        value: https://api.workos.com/user_management/client_01KQT0CRCZP8W8AMAYE5Y1F9SP
      - key: WORKOS_VERIFY_AUDIENCE
        scope: RUN_TIME
        value: "false"
      - key: WORKOS_SECRET_KEY
        scope: RUN_TIME
        type: SECRET                 # set value in console (api), Encrypt
      - key: CLOVER_OAUTH_BASE_URL
        scope: RUN_TIME
        value: https://sandbox.dev.clover.com
      - key: CLOVER_OAUTH_CALLBACK_URL
        scope: RUN_TIME
        # PLACEHOLDER — set to https://<staging-url>/api/v1/pos/clover/callback after first clean deploy
        value: https://REPLACE-WITH-STAGING-URL/api/v1/pos/clover/callback
      - key: CLOVER_POST_CONNECT_REDIRECT
        scope: RUN_TIME
        value: http://localhost:8081/onboarding/found-summary
      - key: CORS_ORIGINS
        scope: RUN_TIME
        value: '["http://localhost:8081"]'
      - key: CLOVER_WEBHOOK_AUTH_CODE
        scope: RUN_TIME
        type: SECRET                 # set value in console (api), Encrypt

workers:
  - name: inbox-worker
    github:
      repo: OsmanWais29/ReorderOS
      branch: sprint-5-recipe-depletion
      deploy_on_push: true
    source_dir: backend
    dockerfile_path: backend/Dockerfile
    instance_count: 1
    instance_size_slug: basic-xxs
    run_command: python -m app.workers.inbox_worker
    # No envs here — inherits all shared vars + secrets from app-level above.

databases:
  - name: reorderos-staging-pg
    engine: PG
    version: "17"
    production: false
    cluster_name: reorderos-staging-pg
