name: backend-ci

on:
  push:
    branches: [main, "claude/**", "sprint-*"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

jobs:
  static:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy
        run: mypy app

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    # Unit tests mock JWT/JWKS — WorkOS vars are fake but must be non-empty
    # so Settings validation passes.
    env:
      WORKOS_CLIENT_ID: client_ci_fake
      WORKOS_JWKS_URL: https://api.workos.com/sso/jwks/client_ci_fake
      WORKOS_ISSUER: https://api.workos.com/user_management/client_ci_fake
      WORKOS_VERIFY_AUDIENCE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Pytest (unit only)
        run: pytest -m "not integration" --cov=app --cov-report=xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: backend/coverage.xml

  migrations-and-openapi:
    name: migrations + integration + openapi
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reorderos
          POSTGRES_PASSWORD: reorderos
          POSTGRES_DB: reorderos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reorderos -d reorderos"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://reorderos:reorderos@localhost:5432/reorderos
      WORKOS_CLIENT_ID: client_ci_fake
      WORKOS_JWKS_URL: https://api.workos.com/sso/jwks/client_ci_fake
      WORKOS_ISSUER: https://api.workos.com/user_management/client_ci_fake
      WORKOS_VERIFY_AUDIENCE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Migrate up
        run: alembic upgrade head
      - name: Check RLS force enabled
        run: |
          python - <<'EOF'
          import asyncio, asyncpg
          async def check():
              conn = await asyncpg.connect(
                  "postgresql://reorderos:reorderos@localhost:5432/reorderos"
              )
              rows = await conn.fetch(
                  "SELECT relname FROM pg_class WHERE relforcerowsecurity = true ORDER BY relname"
              )
              names = {r["relname"] for r in rows}
              required = {"tenants", "user_tenants", "invitations"}
              missing = required - names
              if missing:
                  raise SystemExit(f"FORCE RLS missing on: {missing}")
              print("FORCE RLS OK:", names)
              await conn.close()
          asyncio.run(check())
          EOF
      - name: Migrate down
        run: alembic downgrade base
      - name: Migrate up again
        run: alembic upgrade head
      - name: Integration tests
        run: pytest -m integration -v
      - name: Export OpenAPI
        run: python scripts/export_openapi.py
      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: backend/openapi.json
