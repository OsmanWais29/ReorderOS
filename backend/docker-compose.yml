services:
  db:
    image: postgres:16-alpine
    container_name: reorderos-db
    environment:
      POSTGRES_USER: reorderos
      POSTGRES_PASSWORD: reorderos
      POSTGRES_DB: reorderos
    ports:
      - "5433:5432"
    volumes:
      - reorderos-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reorderos -d reorderos"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Sprint 4: inbox worker — claims pos_event_inbox rows, calls Clover API,
  # writes to orders + sale_line_items.
  inbox-worker:
    build: .
    command: ["python", "-m", "app.workers.inbox_worker"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Sprint 4: reconciliation worker — polls Clover order history every 15 min,
  # backfills missed webhooks, refreshes expiring tokens.
  reconciliation-worker:
    build: .
    command: ["python", "-m", "app.workers.reconciliation_worker"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  reorderos-pg:
