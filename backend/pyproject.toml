[project]
name = "reorderos-backend"
version = "0.1.0"
description = "ReorderOS backend — modular FastAPI monolith for Clover-only v1."
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    # <0.137: FastAPI 0.138+/Starlette 1.3 stop flattening included routers into
    # app.routes (inclusion yields an _IncludedRouter with no .path), which breaks
    # route introspection (the frontend API contract tests). Verified on 0.136.x.
    "fastapi>=0.115,<0.137",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "anthropic>=0.107",
    "structlog>=24.4",
    "python-json-logger>=2.0",
    "boto3>=1.35",
    "PyJWT[cryptography]>=2.9",
    "cryptography>=42",
    "uuid6>=2024.1.12",
    "email-validator>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff==0.15.12",
    "mypy>=1.13",
    "types-requests",
    "httpx>=0.27",
    "respx>=0.22",  # HTTP mocking — imported by the pos/Clover test modules
    "anyio>=4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ── ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
# scripts/v7_proof is the throwaway one-off Clover sandbox harness (blocking httpx
# in ad-hoc async mains, oversized print lines) — excluded rather than fixed; it is
# not production code and will be deleted after the live V7 cert.
extend-exclude = ["alembic/versions", "scripts/v7_proof"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "ASYNC",         # async pitfalls
    "S",             # bandit-lite (security)
    "RUF",           # ruff-specific
]
ignore = [
    "S101",  # assert is fine in tests
    "B008",  # FastAPI uses Depends() in defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "E501", "RUF002", "RUF003", "F841", "SIM300", "SIM105"]
"alembic/env.py" = ["E402"]

# ── mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
explicit_package_bases = true
namespace_packages = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
exclude = "alembic/versions"

[[tool.mypy.overrides]]
module = ["asyncpg.*", "alembic.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requires a live Postgres",
    "slow: performance benchmarks, excluded from CI gate (run with -m slow)",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/__main__.py", "alembic/*"]
